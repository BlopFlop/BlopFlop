<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Неоновый кот летит по звёздному небу. Artur Yungblyud — Python Backend Developer">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0a0a1f"/><stop offset="1" stop-color="#1a0b2e"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="3.5" result="b1"/>
    <feGaussianBlur stdDeviation="9" result="b2"/>
    <feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="textglow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="card"><rect width="1000" height="260" rx="18"/></clipPath>
</defs>
<style>
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1000px)}}
@keyframes bob{0%,100%{transform:translate(400px,128px)}50%{transform:translate(400px,118px)}}
@keyframes trailbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes flow{to{transform:translateX(-60px)}}
@keyframes wag{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(14deg)}}
@keyframes paddle{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.sky{animation:drift 24s linear infinite}
#catpos{animation:bob 1.6s ease-in-out infinite}
.trails{animation:trailbob 1.6s ease-in-out infinite}
.trail{fill:none;stroke-width:6;stroke-linecap:round}
.waves{animation:flow .5s linear infinite}
.tail{transform-origin:-68px -4px;animation:wag 1.1s ease-in-out infinite}
.leg{transform-box:fill-box;transform-origin:50% 0;}
.l1{animation:paddle .5s ease-in-out infinite}
.l2{animation:paddle .5s ease-in-out .25s infinite}
.eyes{transform-origin:88px -32px;animation:blink 4s infinite}
text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif}
.name{font-size:34px;font-weight:700;fill:#fff;animation:flicker 5s linear infinite}
.role{font-size:17px;font-weight:600;fill:#00e5ff;letter-spacing:1px;animation:pulse 2.4s ease-in-out infinite}
.stack{font-size:13px;fill:#c9c9ff;opacity:.85}
</style>
